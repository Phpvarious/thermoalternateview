<script type="text/javascript" src="plugins/thermoAlternateView/3rparty/svg4everybody.js"></script>
<script type="text/javascript" src="plugins/thermoAlternateView/core/template/thermoAlternateView_Display.js"></script>

<div class="eqLogic-widget eqLogic allowResize" style="width: #width#;height: #height#;border:#border#;border-radius:#border-radius#;background-color: #background-color#;color: #color#;#style# "
    data-eqLogic_id="#id#" data-eqLogic_uid="#uid#" data-version="#version#">


    <div class="thermoDark-cover #thermo-cover#">
        <div style="#hideEqLogicName#" class="widget-name #thermo-widget-name#">
            <a href="index.php?v=d&amp;p=thermoAlternateView&amp;m=thermoAlternateView&amp;id=#id#" style="font-size : 1.2em;">#name#</a>
            <span class="object_name">#object_name#</span>
        </div>
        <div class="thermoDark-top-side-right">
            <div class="thermoDark-row-2 thermoDark-contents">
                <div id="thermoDark-temp-ext" style="z-index:100;" class="#temperature-histo#" data-cmd_id="#tempInterieure-id#">
                        <span class="thermoDark-degre">#thermo-unit#</span>
                    <span class="thermoDark-temperature">#temperature-value#</span>
                </div>
                <div style="z-index:100;display:#tempExterieure-visible#" class="thermoDark-temp-externe">
                    <svg class="thermoDark-img" >
                        <use style="visibility: hidden;" xlink:href="plugins/thermoAlternateView/desktop/images/images.svg#shape-icon-externe" />
                    </svg>
                    <span style="z-index:100; float: right;width: 35px;">
                        <span class="thermoDark-degre">#thermo-unit#</span>
                        <span class="thermoDark-temperature-ext #tempExterieure-histo#" data-cmd_id="#tempExterieure-id#">#tempExterieure-value#</span>
                    </span>
                </div>
                <div style="z-index:100;display:#hygrometrie-visible#" class="thermoDark-temp-externe">
                    <svg class="thermoDark-img">
                        <use style="visibility: hidden;" xlink:href="plugins/thermoAlternateView/desktop/images/images.svg#shape-icon-water" />
                    </svg>
                    <!-- <object type="image/svg+xml" data="plugins/thermoAlternateView/resources/water.svg" class="thermoDark-img">
                    </object> -->

                    <span style="z-index:100; float: right;width: 35px;">
                        <span class="thermoDark-degre">%</span>
                        <span style="z-index:100; float: right;" class="thermoDark-hygrometrie #hygrometrie-histo#" data-cmd_id="#hygrometrie-id#">#hygrometrie-value#</span>
                    </span>
                </div>
            </div>
        </div>
        <div class="thermoDark-mode">
            #thermo-mode-mobile#
        </div>
        <div class="thermoDark-back">
            <div>
                <svg class="thermoDark-button thermoDark-button-plus" data-cmd_id="#thermostat-id#" data-cmd_val="#consigne-value#">
                    <use style="visibility: hidden;" xlink:href="plugins/thermoAlternateView/desktop/images/images.svg#shape-icon-up" />
                </svg>
            </div>
            <div class="thermoDark-consigne #consigne-histo#" data-cmd_id="#consigne-id#">
                <span>#consigne-value#</span>
                <span class="thermoDark-degre">#thermo-unit#</span>
            </div>
            <div>
                <svg class="thermoDark-button thermoDark-button-moins" data-cmd_id="#thermostat-id#" data-cmd_val="#consigne-value#">
                    <use style="visibility: hidden;" xlink:href="plugins/thermoAlternateView/desktop/images/images.svg#shape-icon-down" />
                </svg>
            </div>
        </div>
        <div class="thermoDark-right-side">
            <svg style="#thermo-islockColor#;display:#lock-visible#" class="thermoDark-button thermoDark-lock-icon" data-cmd_id="#lock-id#" data-cmd_id2="#lock-id2#">
                <use style="visibility: hidden;" xlink:href="plugins/thermoAlternateView/desktop/images/images.svg#lock-icon#" />
            </svg>
            <svg style="#statut-color#" class="thermoDark-mode-icon" data-cmd_id="#statut-id#">
                <use style="visibility: hidden;" xlink:href="plugins/thermoAlternateView/desktop/images/images.svg#statut-icon#" />
            </svg>
        </div>
        <div class="thermoDark-bottom-side-right">
            <div class="thermoDark-row-2 thermoDark-contents">
                <div style="z-index:100;display:#puissance-visible#" class="thermoDark-temp-externe">
                    <svg class="thermoDark-img">
                        <use style="visibility: hidden;" xlink:href="plugins/thermoAlternateView/desktop/images/images.svg#shape-icon-power" />
                    </svg>
                    <span style="z-index:100; float: right;width: 35px;">
                        <span class="thermoDark-degre">%</span>
                        <span style="z-index:100; float: right;" class="thermoDark-puissance #puissance-histo#" data-cmd_id="#puissance-id#">#puissance-value#</span>
                    </span>
                </div>
            </div>
        </div>
        <div class="thermoDark-statistics" style="display:#statistics-visible#">
            <svg class="thermoDark-button-statistics">
                <use style="visibility: hidden;" xlink:href="plugins/thermoAlternateView/desktop/images/images.svg#shape-statistics" />
            </svg>
        </div>
        <div style="display:#nextConsigne-visible#" class="thermoDark-next-consigne">
            #thermo-nextOccurence#
        </div>
    </div>
</div>

<script type="text/javascript">
    $(document).change(function (e) {

        if (e.target.dataset.eqlogic_uid === "#uid#") {
            initDisplay#uid#();
        }
    });

    $(document).ready(function () {
        initDisplay#uid#();
    });

    function initDisplay#uid#() {
        var param = {};

        param.uid = "#uid#";
        param.tempInterieureId = "#tempInterieure-id#";
        param.tempExterieureId = "#tempExterieure-id#";
        param.hygrometrieId = "#hygrometrie-id#";
        param.puissanceId = "#puissance-id#";
        param.consigneId = "#thermostat-id#";
        param.statutId = "#statut-id#";
        param.lockId = "#lock-id#";
        param.modeId = "#mode-id#";
        param.lockColor = "#thermo-lockColor#";
        param.flameColor = "#thermo-flameColor#";
        param.waitColor = "#thermo-waitColor#";
        param.fanColor = "#thermo-fanColor#";
        param.eqLogicId = "#thermo-eqLogicId#";
        param.statisticsUrl = "#statistics-url#";

        initialize(param, "dark");
    }
</script>
