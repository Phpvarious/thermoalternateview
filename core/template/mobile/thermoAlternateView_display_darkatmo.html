<script type="text/javascript" src="plugins/thermoAlternateView/3rparty/svg4everybody.js"></script>
<script type="text/javascript" src="plugins/thermoAlternateView/core/template/thermoAlternateView_Display.js"></script>

<div class="eqLogic-widget eqLogic allowResize" style="width: #width#;height: #height#;border:#border#;border-radius:#border-radius#;background-color: #background-color#;color: #color#;#style# "
    data-eqLogic_id="#id#" data-eqLogic_uid="#uid#" data-version="#version#">


    <div class="thermoDarkatmo-cover #thermo-cover#">

        <center style="#hideEqLogicName#" class="widget-name #thermo-widget-name#">
            <span>#name#</span>
            <span style="font-size: 0.85em;position: relative;top:-2px;"></span>
        </center>

        <div class="thermoDarkatmo-mode">
            #thermo-mode-mobile#
        </div>
        <div class="thermoDarkatmo-back #thermo-back#">
            <div class="thermoDarkatmo-button thermoDarkatmo-button-plus" data-cmd_id="#thermostat-id#" data-cmd_val="#consigne-value#">+</div>
            <div class="thermoDarkatmo-temperature">
                <span>#tempInterieure1#</span>
                <span class="thermoDarkatmo-degre">#tempInterieure2#</span>
            </div>
            <div class="thermoDarkatmo-consigne">
                <span>#tempConsigne1#</span>
                <span class="thermoDarkatmo-degre">#tempConsigne2#</span>
            </div>
            <div class="thermoDarkatmo-button thermoDarkatmo-button-moins" data-cmd_id="#thermostat-id#" data-cmd_val="#consigne-value#">-</div>
            <svg style="#statut-color#" class="thermoDarkatmo-mode-icon" data-cmd_id="#statut-id#">
                <use style="visibility: hidden;" xlink:href="plugins/thermoAlternateView/resources/images.svg#statut-icon#" />
            </svg>
            <svg style="#thermo-islockColor#" class="thermoDarkatmo-button thermoDarkatmo-lock-icon" data-cmd_id="#lock-id#" data-cmd_id2="#lock-id2#">
                <use style="visibility: hidden;" xlink:href="plugins/thermoAlternateView/resources/images.svg#lock-icon#" />
            </svg>
        </div>
        <div style="display:#tempExterieure-visible#" class="thermoDarkatmo-temp-externe-mobile">
            <svg class="thermoDarkatmo-img thermoDarkatmo-img-mobile">
                <use style="visibility: hidden;" xlink:href="plugins/thermoAlternateView/resources/images.svg#shape-icon-externe" />
            </svg>
            <span class="thermoDarkatmo-temperature-ext" data-cmd_id="#tempExterieure-id#">#tempExterieure-value#</span>
            <span class="thermoDarkatmo-unit">#thermo-unit#</span>
        </div>
        <div style="display:#hygrometrie-visible#" class="thermoDarkatmo-hygrometrie-mobile">
                <svg class="thermoDarkatmo-img">
                    <use style="visibility: hidden;" xlink:href="plugins/thermoAlternateView/resources/images.svg#shape-icon-water" />
                </svg>
                <span class="thermoDarkatmo-hygrometrie #hygrometrie-histo#" data-cmd_id="#hygrometrie-id#">#hygrometrie-value#</span>
                <span class="thermoDarkatmo-unit">%</span>
            </div>
    </div>
</div>


<script type="text/javascript">
    $(document).change(function (e) {

        if (e.target.dataset.eqlogic_uid === "#uid#") {
            initDisplay#uid#();
        }
    });

    $(document).ready(function () {
        initDisplay#uid#();

        $(".eqLogic-widget[data-eqLogic_uid=#uid#]").height($(".eqLogic-widget[data-eqLogic_uid=#uid#]").width());
    });

    function initDisplay#uid#() {
        var param = {};

        param.uid = "#uid#";
        param.tempInterieureId = "#tempInterieure-id#";
        param.tempExterieureId = "#tempExterieure-id#";
        param.hygrometrieId = "#hygrometrie-id#";
        param.puissanceId = "#puissance-id#";
        param.consigneId = "#thermostat-id#";
        param.statutId = "#statut-id#";
        param.lockId = "#lock-id#";
        param.modeId = "#mode-id#";
        param.lockColor = "#thermo-lockColor#";
        param.flameColor = "#thermo-flameColor#";
        param.waitColor = "#thermo-waitColor#";
        param.fanColor = "#thermo-fanColor#";
        param.mobile = true;

        initialize(param, "darkatmo");
    }
</script>
