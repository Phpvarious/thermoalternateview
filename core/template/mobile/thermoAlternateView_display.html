    <div class="thermo-cover #thermo-cover#">

        <center style="#hideEqLogicName#" class="widget-name #thermo-widget-name#">
            <span>#name#</span>
            <span style="font-size: 0.85em;position: relative;top:-2px;"></span>
        </center>

        <div class="thermo-mode">
            #thermo-mode-mobile#
        </div>
        <div class="thermo-back #thermo-back#">
            <div class="thermo-button thermo-button-plus" data-cmd_id="#thermostat-id#" data-cmd_val="#consigne-value#">+</div>
            <div class="thermo-temperature">
                <span>#tempInterieure1#</span>
                <span class="thermo-degre">#tempInterieure2#</span>
            </div>
            <div class="thermo-consigne">
                <span>#tempConsigne1#</span>
                <span class="thermo-degre">#tempConsigne2#</span>
            </div>
            <div class="thermo-button thermo-button-moins" data-cmd_id="#thermostat-id#" data-cmd_val="#consigne-value#">-</div>
            <svg style="#statut-color#" class="thermo-mode-icon" data-cmd_id="#statut-id#">
                <use xlink:href="#statut-icon#" />
            </svg>
            <svg style="#thermo-islockColor#" class="thermo-button thermo-lock-icon" data-cmd_id="#lock-id#" data-cmd_id2="#lock-id2#">
                <use xlink:href="#lock-icon#" />
            </svg>
        </div>
        <div style="display:#tempExterieure-visible#" class="thermo-temp-externe thermo-temp-externe-mobile">
            <svg class="thermo-img thermo-img-mobile">
                <use xlink:href="#shape-icon-externe" />
            </svg>
            <span class="thermo-temperature-ext" data-cmd_id="#tempExterieure-id#">#tempExterieure-value#</span>
            <span>°</span>
        </div>
    </div>
</div>


<script type="text/javascript">
    $(document).change(function (e) {

        if (e.target.dataset.eqlogic_uid === "#uid#") {
            initDisplay#uid#();
        }
    });

    $(document).ready(function () {
        initDisplay#uid#();
    });

    function initDisplay#uid#() {
        var param = {};

        param.uid = "#uid#";
        param.tempInterieureId = "#tempInterieure-id#";
        param.tempExterieureId = "#tempExterieure-id#";
        param.consigneId = "#thermostat-id#";
        param.statutId = "#statut-id#";
        param.lockId = "#lock-id#";
        param.modeId = "#mode-id#";
        param.lockColor = "#thermo-lockColor#";
        param.flameColor = "#thermo-flameColor#";
        param.waitColor = "#thermo-waitColor#";
        param.mobile = true;

        initialize(param);
    }
</script>
