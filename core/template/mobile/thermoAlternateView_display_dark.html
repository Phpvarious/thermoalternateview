<script type="text/javascript" src="plugins/thermoAlternateView/3rparty/svg4everybody.js"></script>
<script type="text/javascript" src="plugins/thermoAlternateView/core/template/thermoAlternateView_Display.js"></script>

<div class="eqLogic-widget eqLogic allowResize" style="width: #width#;height: #height#;border:#border#;border-radius:#border-radius#;background-color: #background-color#;color: #color#;#style# "
    data-eqLogic_id="#id#" data-eqLogic_uid="#uid#" data-version="#version#">


    <div class="thermoDark-cover #thermo-cover#">
        <div style="#hideEqLogicName#" class="widget-name #thermo-widget-name#">
            <span>#name#</span>
            <span class="object_name">#object_name#</span>
        </div>
        <div class="thermoDark-top-side-right-mobile thermoDark-col-2 thermoDark-flex thermoDark-flex">
            <div style="margin-left:5px;text-align:left;">
                <div style="display:#tempExterieure-visible#">
                    <svg style="margin: 0 0 0 auto;" class="thermoDark-img-mobile">
                        <use style="visibility: hidden;" xlink:href="plugins/thermoAlternateView/desktop/images/images.svg#shape-icon-externe" />
                    </svg>
                    <span style="margin: auto 0px auto 5px;" class="thermoDark-temperature-ext" data-cmd_id="#tempExterieure-id#">#tempExterieure-value#</span>
                    <span style="margin: auto auto auto 0px;">#thermo-unit#</span>
                </div>
                <div style="display:#hygrometrie-visible#">
                    <svg style="margin: 0 0 0 auto;" class="thermoDark-img-mobile">
                        <use style="visibility: hidden;" xlink:href="plugins/thermoAlternateView/desktop/images/images.svg#shape-icon-water" />
                    </svg>
                    <span style="margin: auto 0px auto 5px;" class="thermoDark-hygrometrie" data-cmd_id="#hygrometrie-id#">#hygrometrie-value#</span>
                    <span style="margin: auto auto auto 0px;">%</span>
                </div>
            </div>
            <div class="thermoDark-flex">
                <span class="thermoDark-temperature thermoDark-temperature-mobile">#temperature-value#</span>
                <span class="thermoDark-degre-mobile">#thermo-unit#</span>
            </div>
        </div>
        <div class="thermoDark-mode-mobile">
            #thermo-mode-mobile#
        </div>
        <div class="thermoDark-back-mobile">
            <div>
                <svg class="thermoDark-button thermoDark-button-mobile thermoDark-button-plus" data-cmd_id="#thermostat-id#" data-cmd_val="#consigne-value#">
                    <use style="visibility: hidden;" xlink:href="plugins/thermoAlternateView/desktop/images/images.svg#shape-icon-up" />
                </svg>
            </div>
            <div class="thermoDark-consigne thermoDark-consigne-mobile">
                <span>#consigne-value#</span>
                <span class="thermoDark-degre">#thermo-unit#</span>
            </div>
            <div>
                <svg class="thermoDark-button thermoDark-button-mobile thermoDark-button-moins" data-cmd_id="#thermostat-id#" data-cmd_val="#consigne-value#">
                    <use style="visibility: hidden;" xlink:href="plugins/thermoAlternateView/desktop/images/images.svg#shape-icon-down" />
                </svg>
            </div>
        </div>
        <div style="left:calc(100% - 15px);" class="thermoDark-right-side">
            <svg style="width:20px;display:flex;#thermo-islockColor#" class="thermoDark-button thermoDark-lock-icon" data-cmd_id="#lock-id#"
                data-cmd_id2="#lock-id2#">
                <use style="visibility: hidden;" xlink:href="plugins/thermoAlternateView/desktop/images/images.svg#lock-icon#" />
            </svg>
            <svg style="width:20px;display:flex;#statut-color#" class="thermoDark-mode-icon" data-cmd_id="#statut-id#">
                <use style="visibility: hidden;" xlink:href="plugins/thermoAlternateView/desktop/images/images.svg#statut-icon#" />
            </svg>
        </div>
    </div>
</div>

<script type="text/javascript">
    $(document).change(function (e) {

        if (e.target.dataset.eqlogic_uid === "#uid#") {
            initDisplay#uid#();
        }
    });

    $(document).ready(function () {
        initDisplay#uid#();

        $(".eqLogic-widget[data-eqLogic_uid=#uid#]").height($(".eqLogic-widget[data-eqLogic_uid=#uid#]").width());
    });

    function initDisplay#uid#() {
        var param = {};

        param.uid = "#uid#";
        param.tempInterieureId = "#tempInterieure-id#";
        param.tempExterieureId = "#tempExterieure-id#";
        param.hygrometrieId = "#hygrometrie-id#";
        param.puissanceId = "#puissance-id#";
        param.consigneId = "#thermostat-id#";
        param.statutId = "#statut-id#";
        param.lockId = "#lock-id#";
        param.modeId = "#mode-id#";
        param.lockColor = "#thermo-lockColor#";
        param.flameColor = "#thermo-flameColor#";
        param.waitColor = "#thermo-waitColor#";
        param.fanColor = "#thermo-fanColor#";
        param.mobile = true;

        initialize(param, "dark");
    }
</script>
